<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="STEPファイルをブラウザ内だけで開く3Dビューアー"><title>STEP Viewer</title></head>
<body><header><a class="brand" href="./">◈ <strong>STEP</strong> Viewer</a><span class="badge">LOCAL · PRIVATE</span><label class="open">ファイルを開く<input id="file" type="file" accept=".step,.stp" hidden></label></header>
<main id="viewport"><div id="canvas"></div><section id="welcome"><div class="symbol">◈</div><p class="eyebrow">YOUR MODEL, IN YOUR BROWSER</p><h1>STEPを、すぐに3Dで。</h1><p>ここにファイルをドロップ<br>または「ファイルを開く」から選択</p><span class="formats">.step / .stp</span><button id="demo">サンプルを表示 ↗</button></section><div id="drop">STEPファイルをドロップ</div><div id="loading" hidden><span class="spinner"></span><span id="progress">モデルを読み込んでいます…</span><button id="cancel">キャンセル</button></div><div id="error" role="alert" hidden></div><aside id="info" hidden><p class="eyebrow">MODEL</p><h2 id="filename"></h2><p id="stats"></p><p id="dimensions"></p></aside><nav aria-label="表示操作"><button id="fit" title="全体表示 (F)">全体表示</button><button id="iso">斜め</button><button id="top">上面</button><button id="front">正面</button><button id="edges" aria-pressed="true">エッジ</button></nav><div class="axis"> <span>X</span> <span>Y</span> <span>Z</span></div></main>
<footer><span>↔ ドラッグで回転 · 右ドラッグで移動 · スクロールで拡大</span><span>ファイルは外部に送信されません</span><a href="./licenses/NOTICE.txt" target="_blank" rel="noopener">ライセンス</a></footer><script type="module" src="/src/main.js"></script></body></html>
